name: Android Release Build and Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'gradle'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor to Android
        run: npx cap sync android

      - name: Check Secrets
        run: |
          if [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing. Go to Settings > Secrets and variables > Actions to add it."
            exit 1
          fi
          if [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ]; then
            echo "ERROR: ANDROID_KEYSTORE_PASSWORD secret is missing. Go to Settings > Secrets and variables > Actions to add it."
            exit 1
          fi
          if [ -z "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "ERROR: PLAY_SERVICE_ACCOUNT_JSON secret is missing. Go to Settings > Secrets and variables > Actions to add it."
            exit 1
          fi

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import base64, os, re
          data = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          if not data:
              raise ValueError('Keystore base64 secret is empty!')
          clean_data = re.sub(r'[^A-Za-z0-9+/=]', '', data)
          rem = len(clean_data) % 4
          if rem == 1:
              clean_data = clean_data[:-1]
          elif rem > 1:
              clean_data += '=' * (4 - rem)
          decoded = base64.b64decode(clean_data)
          print(f'Successfully decoded binary size: {len(decoded)} bytes')
          open('android/app/release.keystore', 'wb').write(decoded)
          "
          ls -lh android/app/release.keystore

      - name: Calculate Version Info
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 215 ))
          VERSION_NAME="0.2.$(( ${{ github.run_number }} + 15 ))"
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Build Android App Bundle
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Sign App Bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" android/app/build/outputs/bundle/release/app-release.aab "price-compare-key"

      - name: Upload to Google Play Console
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.blakelamb.price_compare
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
